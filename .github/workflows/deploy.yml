name: Desplegar Rural69 en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # `deploy-pages` lo necesita para localizar el artefacto que sube el otro trabajo.
  actions: read

# Un despliegue a la vez; si llegan varios, se queda el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    name: Construir la aplicación
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npx tsc -b

      - name: Comprobar contraste
        run: node scripts/contraste.mjs

      - name: Construir
        run: npx vite build
        env:
          # Claves públicas de Supabase (Settings -> Secrets and variables -> Actions)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # GitHub Pages sirve la app bajo /<nombre-del-repositorio>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir el resultado
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Desde la v4 los archivos ocultos se quedan fuera, y en dist/ hay un
          # .nojekyll que viene de public/. Así el artefacto sigue siendo el mismo.
          include-hidden-files: true

  desplegar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v5
