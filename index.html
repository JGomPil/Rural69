<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f5d42" />
    <script>
      // Modo oscuro, antes del primer pintado. Si esto esperara a React, al
      // abrir la app en oscuro se vería un fogonazo blanco. Deja escrito en
      // <html> el tema ya resuelto; useTema se encarga del resto.
      (function () {
        try {
          var guardada = localStorage.getItem('rural69-tema')
          var oscuro =
            guardada === 'oscuro' ||
            ((guardada === null || guardada === 'sistema') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro'
          if (oscuro) {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#13160f')
          }
        } catch (e) {
          document.documentElement.dataset.tema = 'claro'
        }
      })()
    </script>
    <script>
      // Supabase devuelve la sesión de las invitaciones y de «he olvidado la
      // contraseña» en el # de la URL. Ese mismo # es el que usa el router
      // para navegar, así que si no la rescatamos aquí —antes de que exista
      // React— el router lo pisa con su ruta y la sesión se pierde sin una
      // sola queja: el invitado acaba en la pantalla de acceso, pidiéndole
      // una contraseña que nunca ha tenido.
      ;(function () {
        var h = window.location.hash || ''
        if (h.indexOf('access_token=') === -1 && h.indexOf('error') === -1) return
        var p = new URLSearchParams(h.replace(/^#\/?/, ''))
        if (!p.get('access_token') && !p.get('error') && !p.get('error_description')) return
        window.__rural69Entrada = {
          access_token: p.get('access_token'),
          refresh_token: p.get('refresh_token'),
          tipo: p.get('type') || 'invite',
          error: p.get('error_description') || p.get('error'),
        }
        // Que sobreviva a una recarga: si no, quien recargue a medio camino
        // se queda dentro pero sin contraseña puesta.
        try {
          if (!window.__rural69Entrada.error) {
            sessionStorage.setItem('rural69-entrada', window.__rural69Entrada.tipo)
          }
        } catch (e) {
          /* navegación privada: sin memoria, pero el paso sigue valiendo */
        }
        history.replaceState(null, '', window.location.pathname + window.location.search)
      })()
    </script>
    <script>
      // Chrome dispara «beforeinstallprompt» en cuanto carga la página, que
      // puede ser antes de que React monte nada. Si nadie lo escucha, se
      // pierde, y entonces la aplicación cree que no se puede instalar.
      window.__rural69Instalable = null
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__rural69Instalable = e
      })
    </script>
    <meta name="description" content="Rural69 · La central de mando de nuestras escapadas a casas rurales." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rural69" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Rural69</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..800&family=Inter:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
